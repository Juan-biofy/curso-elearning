<title>Academia Comercial · Culligan Biofy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--azul:#2968fe;--azul-osc:#1a4fd6;--azul-hielo:#f4f8ff;--texto:#0f1b33;--suave:#5b6785;--borde:#dde5f5;--error:#d93636}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Figtree,system-ui,-apple-system,sans-serif;color:var(--texto);background:var(--azul);display:grid;place-items:center;padding:24px 16px;position:relative;overflow:hidden}
.burbuja{position:absolute;border-radius:50%;background:rgba(255,255,255,.08);animation:sube 14s linear infinite}
@keyframes sube{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
.tarjeta{position:relative;background:#fff;border-radius:24px;padding:36px 28px;width:100%;max-width:400px;box-shadow:0 24px 60px rgba(10,30,90,.25);text-align:center}
.logo{width:180px;height:auto;color:var(--azul);display:block;margin:0 auto 22px}
h1{font-family:"Bricolage Grotesque",Figtree,sans-serif;font-weight:800;font-size:1.55rem;margin:0 0 6px}
p{margin:0 0 22px;color:var(--suave);line-height:1.45}
form{display:grid;gap:12px;text-align:left}
input[type=password]{width:100%;padding:13px 14px;border:1.5px solid var(--borde);border-radius:12px;font:inherit;font-size:16px;background:var(--azul-hielo)}
input[type=password]:focus{outline:none;border-color:var(--azul);background:#fff}
label.rec{display:flex;align-items:center;gap:8px;font-size:.92rem;color:var(--suave);cursor:pointer}
button{border:0;border-radius:999px;padding:13px 24px;font:inherit;font-weight:700;background:var(--azul);color:#fff;cursor:pointer}
button:hover{background:var(--azul-osc)}
button:disabled{opacity:.6;cursor:wait}
.error{color:var(--error);font-size:.92rem;min-height:1.2em;margin:0}
</style>
</head>

  <h1>Academia Comercial</h1>
  <p>Acceso privado. Introduce la contraseña para entrar.</p>
  <form id="f">
    <input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password" required autofocus>

const CLAVE_GUARDADA = 'academia-clave';
const b64 = x => Uint8Array.from(atob(x), c => c.charCodeAt(0));

async function descifrar(pw) {
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const llave = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(BLOB.s), iterations:BLOB.n, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.i)}, llave, b64(BLOB.c));
    return new TextDecoder().decode(pt);
  } catch (e) { return null; }
}

function abrir(html) {
  document.open(); document.write(html); document.close();
}

const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('btn');

f.addEventListener('submit', async e => {
  e.preventDefault();
  err.textContent = ''; btn.disabled = true; btn.textContent = 'Comprobando…';
  const pw = document.getElementById('pw').value;
  const html = await descifrar(pw);
  if (!html) {
    err.textContent = 'Contraseña incorrecta.';
    btn.disabled = false; btn.textContent = 'Entrar';
    return;
  }
  try {
    if (document.getElementById('rec').checked) localStorage.setItem(CLAVE_GUARDADA, pw);
    else localStorage.removeItem(CLAVE_GUARDADA);
  } catch (e) {}
  abrir(html);
});

(async () => {
  let pw = null;
  try { pw = localStorage.getItem(CLAVE_GUARDADA); } catch (e) {}
  if (!pw) return;
  const html = await descifrar(pw);
  if (html) abrir(html);
  else { try { localStorage.removeItem(CLAVE_GUARDADA); } catch (e) {} }
})();
</script>
